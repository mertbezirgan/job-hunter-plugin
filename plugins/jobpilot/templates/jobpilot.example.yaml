# JobPilot workspace settings — written by /jobpilot:setup
version: 2
notion:
  database_id: ""
  parent_page_id: ""
  properties: {}             # internal key -> actual column name (only where different from defaults)
  status_labels: {}          # internal status -> displayed label (if translated)
gmail:
  enabled: true
browser: claude-in-chrome    # claude-in-chrome | built-in
sources:
  linkedin_search: true
  linkedin_collections: true
  linkedin_alert_emails: true
  market_sources: true       # sources listed in the market pack(s) (e.g. Arbeitsagentur, Arbeitnow, StepStone, XING)
  jobspy: false              # Indeed/Glassdoor/Google via scripts/search_jobs.py (needs uv)
  extra_sites: []
  target_companies: []       # [{name: "Acme", ats: greenhouse|lever|ashby|personio|smartrecruiters, board: "acme"}]
limits:
  daily_applications: 15
  max_pages_per_query: 6
  min_score: 65
  shortlist_size: 25
  pre_tailor_top: 3          # scheduled run prepares CV+letter for the top N suggestions
  parallel_agents: 4
schedule:
  run_cron: "0 8 * * 1-5"    # full daily pipeline (sync + hunt + prepare)
  sync_cron: "0 18 * * *"    # evening email sync
linkedin:
  geo_ids: {}
last_hunt_at: null
last_sync_at: null
